[package]
name = "rill"
version = "0.1.8"
description = "Rill — a fast, focused Redis client for macOS"
authors = ["Rill"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "rill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp", "aio", "keep-alive", "streams"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
futures-util = "0.3"
